<style>
/* Reset browser margins and padding */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* Set up the global font */
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

/* Style the navigation container */
.navbar {
  display: flex;
  justify-content: space-between; /* Pushes logo and links to opposite sides */
  align-items: center;            /* Centers items vertically */
  background-color: #333;
  padding: 1rem 2rem;
  position: sticky;               /* Keeps navbar fixed at the top while scrolling */
  top: 0;
  z-index: 1000;
}

/* Style the logo */
.nav-logo a {
  color: #fff;
  font-size: 1.5rem;
  font-weight: bold;
  text-decoration: none;          /* Removes default underline */
}

/* Turn the vertical list into a horizontal line */
.nav-links {
  display: flex;
  list-style: none;               /* Removes standard bullet points */
}

/* Add spacing between links */
.nav-links li {
  margin-left: 20px;
}

/* Style the individual anchor links */
.nav-links a {
  color: #fff;
  text-decoration: none;
  font-size: 1rem;
  transition: color 0.3s ease;    /* Smooth hover effect transition */
}

/* Change link color when a user hovers over it */
.nav-links a:hover {
  color: #ff7b00;
}
  font-family: sans-serif;
  }
</style>
<!-- Custom Blocks Modal Container -->
<div class="scratch-modal" id="customBlocksModal" data-user-role="creator">
  <div class="modal-header">
    <h2>Make a Block</h2>
    <span class="permission-badge">Creator</span>
  </div>

  <div class="modal-body">
    <!-- Block Name Input (Allowed for Creators and Admins) -->
    <div class="form-group permission-require-create">
      <label for="blockName">Block name</label>
      <input type="text" id="blockName" placeholder="block">
    </div>

    <!-- Argument Controls (Allowed for Creators and Admins) -->
    <div class="action-buttons permission-require-create">
      <button class="btn-secondary">+ Add an input (number or text)</button>
      <button class="btn-secondary">+ Add an input (boolean)</button>
      <button class="btn-secondary">+ Add a label</button>
    </div>

    <!-- Administrative Settings (Strictly Hidden for Non-Admins) -->
    <div class="admin-panel permission-require-admin">
      <h3>System Permissions</h3>
      <label>
        <input type="checkbox" id="globalShare"> Share globally across projects
      </label>
    </div>
  </div>

  <!-- Modal Footer Actions -->
  <div class="modal-footer">
    <button class="btn-cancel">Cancel</button>
    <!-- Save button is disabled if the user only has view permissions -->
    <button class="btn-submit permission-require-create">OK</button>
  </div>
</div>
