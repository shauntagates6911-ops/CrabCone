<style>
/* Reset browser margins and padding */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* Set up the global font */
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

/* Style the navigation container */
.navbar {
  display: flex;
  justify-content: space-between; /* Pushes logo and links to opposite sides */
  align-items: center;            /* Centers items vertically */
  background-color: #333;
  padding: 1rem 2rem;
  position: sticky;               /* Keeps navbar fixed at the top while scrolling */
  top: 0;
  z-index: 1000;
}

/* Style the logo */
.nav-logo a {
  color: #fff;
  font-size: 1.5rem;
  font-weight: bold;
  text-decoration: none;          /* Removes default underline */
}

/* Turn the vertical list into a horizontal line */
.nav-links {
  display: flex;
  list-style: none;               /* Removes standard bullet points */
}

/* Add spacing between links */
.nav-links li {
  margin-left: 20px;
}

/* Style the individual anchor links */
.nav-links a {
  color: #fff;
  text-decoration: none;
  font-size: 1rem;
  transition: color 0.3s ease;    /* Smooth hover effect transition */
}

/* Change link color when a user hovers over it */
.nav-links a:hover {
  color: #ff7b00;
}
  font-family: sans-serif;
  }
</style>

    <!-- Define the repeating brick pattern -->
    <pattern id="brick-pattern" width="40" height="20" patternUnits="userSpaceOnUse">
      <!-- Brick background / Mortar color -->
      <rect width="40" height="20" fill="#e0e0e0"/>
      
      <!-- Brick shapes and horizontal/vertical lines -->
      <path d="M 0,0 L 40,0 
               M 0,10 L 40,10 
               M 0,0 L 0,10 
               M 20,10 L 20,20 
               M 40,0 L 40,10" 
            stroke="#b03030" 
            stroke-width="2" 
            fill="none"/>
    </pattern>
  </defs
  <!-- Apply the pattern to any shape -->
  <rect width="100%" height="100%" fill="url(#brick-pattern)" />
</svg>
